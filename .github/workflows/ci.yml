name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets: a PR stacked on another branch
  # would otherwise merge with no test job having run at all.
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        rails: ["7.0", "7.1", "7.2", "8.0"]
        exclude:
          - ruby: "3.2"
            rails: "8.0"

    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}

    env:
      RAILS_VERSION: ${{ matrix.rails }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  hanami:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        hanami: ["2.3", "3.0"]

    name: Ruby ${{ matrix.ruby }} / Hanami ${{ matrix.hanami }}

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/hanami.gemfile
      HANAMI_VERSION: ${{ matrix.hanami }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Rails-free bundle: also proves the gem loads without railties.
      - name: Run Hanami dummy app specs
        working-directory: spec/hanami_dummy
        run: bundle exec rspec

      # The dummy app's middleware loads this document at boot, so a stale one
      # would quietly stop exercising validation.
      - name: Check the committed schema is current
        working-directory: spec/hanami_dummy
        run: |
          bundle exec rake openapi_ruby:generate
          git diff --exit-code openapi/

  sinatra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        sinatra: ["3.2", "4.2"]

    name: Ruby ${{ matrix.ruby }} / Sinatra ${{ matrix.sinatra }}

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/sinatra.gemfile
      SINATRA_VERSION: ${{ matrix.sinatra }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # A plain Rack host: no framework integration beyond the Rack SPEC.
      - name: Run Sinatra dummy app specs
        working-directory: spec/sinatra_dummy
        run: bundle exec rspec

      - name: Run Sinatra dummy app Minitest tests
        working-directory: spec/sinatra_dummy
        run: bundle exec ruby -Itest test/posts_test.rb

      - name: Check the committed schema is current
        working-directory: spec/sinatra_dummy
        run: |
          bundle exec rake openapi_ruby:generate
          git diff --exit-code openapi/

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run Standard
        run: bundle exec standardrb
